<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;1,6..72,400&amp;family=Geist+Mono:wght@500;600&amp;family=Plus+Jakarta+Sans:wght@500;600');
      .serif { font-family: 'Newsreader', Georgia, serif; }
      .mono { font-family: 'Geist Mono', monospace; }
      .sans { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
    </style>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(160, 150, 140, 0.15)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Paper background -->
  <rect width="1200" height="630" fill="#f7f5ed" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Subtle paper inner margin frame -->
  <rect x="50" y="50" width="1100" height="530" fill="none" stroke="#e5dfd3" stroke-width="1.5" />

  <!-- Header Breadcrumb -->
  <text x="90" y="115" class="mono" font-size="16" fill="#78746d" letter-spacing="1">GITSCARS / DETERMINISTIC FAILURE MEMORY</text>
  <text x="1010" y="115" class="mono" font-size="16" fill="#78746d" text-anchor="end">APACHE 2.0 • GO 1.26+</text>

  <!-- Headline -->
  <text x="90" y="240" class="serif" font-size="78" fill="#2b2927" letter-spacing="-1">The weight of <tspan font-style="italic">scars.</tspan></text>

  <!-- Subtitle -->
  <text x="90" y="320" class="serif" font-size="28" fill="#4a4742">
    A Git-native failure memory and regression guardrail system
  </text>
  <text x="90" y="360" class="serif" font-size="28" fill="#4a4742">
    for software engineers and AI coding assistants.
  </text>

  <!-- Ruled box with sample anchor -->
  <rect x="90" y="420" width="1020" height="90" rx="4" fill="#efebe1" stroke="#ded8cb" stroke-width="1" />
  <text x="120" y="455" class="mono" font-size="15" fill="#78746d">$ git-scars inject --files "pkg/telemetry.go" --budget 300</text>
  <text x="120" y="485" class="mono" font-size="14" fill="#c2410c">Injected: map-write-crash (#391945) • Fail-to-Pass Verified • 124 tokens</text>

  <!-- Footer baseline -->
  <line x1="90" y1="540" x2="1110" y2="540" stroke="#e5dfd3" stroke-width="1" />
  <text x="90" y="562" class="mono" font-size="14" fill="#8c8880">github.com/Pavanspoojary/scars</text>
  <text x="1110" y="562" class="mono" font-size="14" fill="#8c8880" text-anchor="end">Deterministic AST Freshness • Zero Drift</text>
</svg>
